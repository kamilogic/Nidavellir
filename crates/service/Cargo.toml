[package]
name = "nidavellir-service"
version = "0.1.0"
description = "Nidavellir Core Service — privileged hardware access"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nidavellir-service"
path = "src/main.rs"

[dependencies]
nidavellir-core = { workspace = true }
nidavellir-driver-pawnio = { workspace = true }
nidavellir-gpu-stress = { path = "../gpu-stress" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
windows-service = "0.7"

[target.'cfg(windows)'.dependencies]
nidavellir-gpu-nvapi = { path = "../gpu-nvapi" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
