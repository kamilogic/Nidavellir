[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/driver-pawnio",
    "crates/gpu-nvapi",
    "crates/gpu-stress",
    "crates/service",
    "apps/ui/src-tauri",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["kamilogic"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.33"
winreg = "0.52"
nidavellir-core = { path = "crates/core" }
nidavellir-driver-pawnio = { path = "crates/driver-pawnio" }
