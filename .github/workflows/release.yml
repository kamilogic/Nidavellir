name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: apps/ui
        run: npm install

      - name: Build NSIS installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-full-release.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nidavellir-windows-setup
          path: target/release/bundle/nsis/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
