[package]
name = "nidavellir"
version = "0.1.0"
description = "Silicon forging tool - optimize your hardware"
authors = ["kamilogic"]
edition = "2021"

[lib]
name = "nidavellir_lib"
crate-type = ["lib"]

[package.metadata]
tauri-winres = { }

[package.metadata.tauri]
frontendLabel = "app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
winreg = "0.52"
